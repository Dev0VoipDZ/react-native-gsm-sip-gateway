name: Build Android APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install root dependencies
      run: npm install

    - name: Install telon-gateway-app dependencies
      run: |
        cd telon-gateway-app
        npm install

    - name: Make Gradlew executable
      run: |
        chmod +x android/gradlew
        chmod +x telon-gateway-app/android/gradlew

    - name: Build Android APK (Debug)
      run: |
        cd telon-gateway-app/android
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Build Android APK (Release - unsigned)
      run: |
        cd telon-gateway-app/android
        ./gradlew assembleRelease --no-daemon --stacktrace
      continue-on-error: true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: telon-gateway-app/android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v3
      if: success()
      with:
        name: app-release
        path: telon-gateway-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
      continue-on-error: true

    - name: Upload All APKs
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: all-apks
        path: telon-gateway-app/android/app/build/outputs/apk/**/*.apk
      continue-on-error: true
